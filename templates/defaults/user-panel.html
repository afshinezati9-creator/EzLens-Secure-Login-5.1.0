<!-- ============================================================
     قالب پیش‌فرض پنل کاربری
     کلاس‌های اصلی: .ezu, .ezu-side, .ezu-main
     ============================================================ -->
<div class="ezu">
    <!-- هدر موبایل -->
    <div class="ezu-m-head">
        <div class="who">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g' cx='50%25' cy='40%25' r='60%25'%3E%3Cstop offset='0%25' stop-color='%23e8edf5'/%3E%3Cstop offset='100%25' stop-color='%23cbd5e1'/%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='45' fill='url(%23g)'/%3E%3Ccircle cx='50' cy='34' r='18' fill='%2394a3b8'/%3E%3Cellipse cx='50' cy='78' rx='30' ry='18' fill='%2394a3b8'/%3E%3C/svg%3E" alt="">
            <div><div class="nm">علی محمدی</div><div class="em">09123456789</div></div>
        </div>
        <a class="back" href="#">← فروشگاه</a>
    </div>

    <div class="ezu-layout">
        <!-- سایدبار -->
        <aside class="ezu-side">
            <div class="ezu-user">
                <img class="ezu-av" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g' cx='50%25' cy='40%25' r='60%25'%3E%3Cstop offset='0%25' stop-color='%23e8edf5'/%3E%3Cstop offset='100%25' stop-color='%23cbd5e1'/%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='45' fill='url(%23g)'/%3E%3Ccircle cx='50' cy='34' r='18' fill='%2394a3b8'/%3E%3Cellipse cx='50' cy='78' rx='30' ry='18' fill='%2394a3b8'/%3E%3C/svg%3E" alt="">
                <div class="ezu-name">علی محمدی</div>
                <div class="ezu-mail">ali@ezlens.ir</div>
            </div>
            <div class="ezu-nav-d">
                <button class="active" data-tab="dashboard">📋 پیشخوان</button>
                <button data-tab="cart">🛒 سبد خرید</button>
                <button data-tab="orders">📦 سفارش‌ها</button>
                <button data-tab="address">📍 آدرس</button>
                <button data-tab="profile">👤 پروفایل</button>
                <button data-tab="prescription">💊 نسخه پزشکی</button>
                <button data-tab="security">🔒 امنیت</button>
                <button data-tab="support">📞 پشتیبانی</button>
                <button class="logout">🚪 خروج</button>
            </div>
            <a class="shop-btn" href="#">🏪 بازگشت به فروشگاه</a>
        </aside>

        <main class="ezu-main">
            <!-- پیشخوان -->
            <section class="ezu-tab active" id="tab-dashboard">
                <h2 class="ezu-title">سلام علی 👋</h2>
                <div class="ezu-stats">
                    <div class="ezu-stat"><p class="l">مجموع خرید</p><p class="v">۱۲,۴۵۰,۰۰۰</p></div>
                    <div class="ezu-stat"><p class="l">سفارش‌ها</p><p class="v">۲۳</p></div>
                    <div class="ezu-stat"><p class="l">در جریان</p><p class="v">۳</p></div>
                    <div class="ezu-stat"><p class="l">روز عضویت</p><p class="v">۱۸۵</p></div>
                </div>
                <div class="ezu-charts">
                    <div class="ezu-chart"><h4>روند خرید ۶ ماه</h4><canvas id="panelChart1"></canvas></div>
                    <div class="ezu-chart"><h4>وضعیت سفارش‌ها</h4><canvas id="panelChart2"></canvas></div>
                </div>
            </section>
        </main>
    </div>

    <!-- منوی پایین موبایل -->
    <nav class="ezu-bottom-nav">
        <div class="ezu-bottom-nav-inner">
            <button class="active" data-tab="dashboard"><svg>...</svg>خانه</button>
            <button data-tab="cart"><svg>...</svg>سبد</button>
            <button data-tab="orders"><svg>...</svg>سفارش</button>
            <button data-tab="profile"><svg>...</svg>پروفایل</button>
            <button data-tab="prescription"><svg>...</svg>نسخه</button>
        </div>
    </nav>
</div>
